  <style>
    * { cursor: default; }

    .image-grayscale:hover { filter: none; }

<body class="bg-black text-white font-mono min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    function ScrambleText({ text }) {
      const [display, setDisplay] = useState(text);
      const timer = useRef(null);

      const scramble = () => {
        let i = 0;
        clearInterval(timer.current);
        timer.current = setInterval(() => {
          setDisplay(
            text.split('').map((ch, idx) => {
              if (ch === ' ') return ' ';
              if (idx < i) return text[idx];
              return SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
            }).join('')
          );
          i += 0.6;
          if (i > text.length) {
            clearInterval(timer.current);
            setDisplay(text);
          }
        }, 30);
      };

      useEffect(() => () => clearInterval(timer.current), []);
      return <span onMouseEnter={scramble}>{display}</span>;
    }

    function Arrow() {
      return (
        <svg className="inline h-3 w-3 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M7 17L17 7M17 7H7M17 7v10" />
        </svg>
      );
    }

    function SidebarLink({ href, children, download }) {
      const isExternal = typeof href === 'string' && href.startsWith('http');
      return (
        <a
          href={href}
          download={download || undefined}
          target={isExternal ? '_blank' : undefined}
          rel={isExternal ? 'noopener noreferrer' : undefined}
          className="group flex items-center gap-1.5 text-[#888] hover:text-white transition-colors duration-200 text-xs w-fit"
        >
          <ScrambleText text={children} />
          <Arrow />
        </a>
      );
    }

    function ListItem({ num, title, company, href, date, bullets }) {
      return (
        <div className="mb-9 last:mb-0">
          <p className="text-[#444] text-xs mb-1 tabular-nums">{num}</p>
          <p className="text-sm leading-snug mb-1">
            <span className="text-white font-medium">{title} </span>
            <a
              href={href}
              target="_blank"
              rel="noopener noreferrer"
              className="group text-[#888] hover:text-white transition-colors inline-flex items-center gap-0.5"
            >
              @ <ScrambleText text={company} /><Arrow />
            </a>
          </p>
          <p className="text-[#555] text-xs italic mb-2">{date}</p>
          <ul className="space-y-1">
            {bullets.map((b, i) => (
              <li key={i} className="text-[#888] text-xs leading-relaxed">· {b}</li>
            ))}
          </ul>
        </div>
      );
    }

                <div className="anim anim-1">

                    Rajeshwar x AI
                  </h1>
                  <div className="space-y-0.5">
                    <p className="text-white text-sm font-medium">Rajeshwar Sehdev</p>
                    <p className="text-[#888] text-xs">Senior AI/ML Engineer</p>
                    <p className="text-[#888] text-xs">India</p>
                    <a href="mailto:rajeshwarsehdev@gmail.com" className="text-[#888] text-xs hover:text-white transition-colors link-underline inline-block mt-0.5">
                      rajeshwarsehdev@gmail.com
                    </a>
                  </div>
                </div>

                <div className="anim anim-2">
                  {/* Photo — replace div with img tag once you have a photo */}
                  <div className="image-grayscale w-[200px] h-[256px] bg-[#0f0f0f] border border-[#1a1a1a] flex items-center justify-center text-[#333] text-3xl font-bold italic rounded-sm select-none">
                    RS
                  </div>
                  {/* <img src="assets/photo.jpg" alt="Rajeshwar Sehdev" className="image-grayscale w-[200px] h-[256px] object-cover rounded-sm" /> */}
                </div>

                <div className="anim anim-3 space-y-3">
                  <SidebarLink href="assets/CV_Rajeshwar_Sehdev.pdf" download>CV</SidebarLink>
                  <SidebarLink href="#blog">Blog</SidebarLink>
                  <SidebarLink href="https://www.linkedin.com/in/rajeshwar-sehdev-290a98b7/">LinkedIn</SidebarLink>
                  <SidebarLink href="mailto:rajeshwarsehdev@gmail.com">Email</SidebarLink>
                </div>

              </div>

              {/* ── CENTER ── */}
              <div className="lg:col-span-4">

                <div className="anim anim-2">
                  <h2 className="text-[10px] text-[#555] uppercase tracking-[0.2em] mb-8">Recent Experience</h2>

                  <ListItem
                    num="01"

                      { cat: 'Cloud & Infra',list: 'AWS SageMaker · Lambda · EKS · S3 · Docker · Kubernetes · OpenSearch' },
                      { cat: 'Apps',         list: 'FastAPI · Streamlit · PostgreSQL · REST APIs' },
                    ].map(({ cat, list }) => (
                      <div key={cat}>
                        <p className="text-[10px] text-[#444] uppercase tracking-widest mb-1">{cat}</p>
                        <p className="text-xs text-[#888] leading-relaxed">{list}</p>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

              {/* ── RIGHT ── */}
              <div className="lg:col-span-4">

                <div className="anim anim-3">
                  <h2 className="text-[10px] text-[#555] uppercase tracking-[0.2em] mb-8">Past Work</h2>

                  <ListItem
                    num="01"

                  <ListItem

                    bullets={[
                      'ML incident classification — reduced misclassification by 40%',
                      'NLP ticket categorization cutting manual effort by 60%',

                    ]}
                  />
                </div>

                <div className="anim anim-4 mt-10 pt-8 border-t border-[#111]" id="blog">
                  <h2 className="text-[10px] text-[#555] uppercase tracking-[0.2em] mb-6">Blog</h2>
                  <p className="text-xs text-[#888] leading-relaxed">
                    Writing on Generative AI, LLM system design, multi-agent architectures, and production lessons.
                  </p>
                  <p className="text-xs text-[#444] italic mt-3 leading-relaxed">
                    Coming soon — RAG pipelines · LangGraph patterns · LLM evaluation · AWS MLOps
                  </p>
                </div>

                <div className="anim anim-5 mt-10 pt-8 border-t border-[#111]">
                  <h2 className="text-[10px] text-[#555] uppercase tracking-[0.2em] mb-6">Certifications & Education</h2>
                  <div className="space-y-5">
                    {[
                      { n: '01', title: 'AWS Machine Learning Specialty', meta: 'Amazon Web Services · 2025' },
                      { n: '02', title: 'Applied AI & Machine Learning', meta: 'Professional Training Course' },
                      { n: '03', title: 'Bachelor of Computer Applications', meta: 'GGSIP University · Delhi · 2016' },
                    ].map(({ n, title, meta }) => (
                      <div key={n} className="flex gap-4">
                        <span className="text-[#333] text-xs w-5 flex-shrink-0 tabular-nums pt-0.5">{n}</span>
                        <div>
                          <p className="text-white text-xs font-medium">{title}</p>
                          <p className="text-[#888] text-xs mt-0.5">{meta}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

            {/* FOOTER */}
            <div className="mt-16 pt-6 border-t border-[#111] anim anim-6">
              <p className="text-xs text-[#333]">© {new Date().getFullYear()} Rajeshwar Sehdev</p>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
