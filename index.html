  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── ScrambleText ────────────────────────────────────────────────────────
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    function ScrambleText({ text }) {
      const [out, setOut] = useState(text);
      const t = useRef(null);
      const run = () => {
        let i = 0;
        clearInterval(t.current);
        t.current = setInterval(() => {
          setOut(text.split('').map((c, idx) => {
            if (c === ' ') return ' ';
            if (idx < i) return text[idx];
            return CHARS[Math.floor(Math.random() * CHARS.length)];
          }).join(''));
          i += 0.6;
          if (i > text.length) { clearInterval(t.current); setOut(text); }
        }, 30);
      };
      useEffect(() => () => clearInterval(t.current), []);
      return <span onMouseEnter={run}>{out}</span>;
    }

    // ── Arrow ───────────────────────────────────────────────────────────────
    function Arrow() {
      return (
        <svg className="inline h-3 w-3 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M7 17L17 7M17 7H7M17 7v10" />
        </svg>
      );
    }

    // ── SidebarLink ─────────────────────────────────────────────────────────
    function SidebarLink({ href, children, download }) {
      const ext = href && href.startsWith('http');
      return (
        <a href={href} download={download||undefined}
          target={ext ? '_blank' : undefined}
          rel={ext ? 'noopener noreferrer' : undefined}
          className="group flex items-center gap-1 text-[#888] hover:text-white transition-colors text-xs w-fit"
        >
          <ScrambleText text={children} /><Arrow />
        </a>
      );
    }

    // ── ListItem ────────────────────────────────────────────────────────────
    function ListItem({ num, title, company, href, date, bullets }) {
      return (
        <div className="mb-7 last:mb-0">
          <p className="text-[#444] text-[10px] mb-0.5 tabular-nums">{num}</p>
          <p className="text-sm leading-snug mb-0.5">
            <span className="text-white font-medium">{title} </span>
            <a href={href} target="_blank" rel="noopener noreferrer"
              className="group text-[#888] hover:text-white transition-colors inline-flex items-center gap-0.5">
              @ <ScrambleText text={company} /><Arrow />
            </a>
          </p>
          <p className="text-[#555] text-[10px] italic mb-1.5">{date}</p>
          <ul className="space-y-0.5">
            {bullets.map((b, i) => (
              <li key={i} className="text-[#888] text-[11px] leading-relaxed">· {b}</li>
            ))}
          </ul>
        </div>
      );
    }

                    {[
                      { n: '01', title: 'AWS Machine Learning Specialty', meta: 'Amazon Web Services · 2025' },

              <div className="lg:col-span-4 a3">
                <h2 className="text-[10px] text-[#555] uppercase tracking-[0.2em] mb-6">Past Work</h2>

                <ListItem
                  num="01"
                  title="Senior Data Scientist"
                  company="Gramener"

                <ListItem

                {/* Blog */}
                <div className="mt-8 pt-6 border-t border-[#111]" id="blog">
                  <h2 className="text-[10px] text-[#555] uppercase tracking-[0.2em] mb-4">Blog</h2>
                  <p className="text-[11px] text-[#888] leading-relaxed">

                  </p>
                  <p className="text-[10px] text-[#444] italic mt-2 leading-relaxed">

                </div>
              </div>

            </div>

            {/* Footer */}
            <div className="mt-10 pt-4 border-t border-[#111] a5">
              <p className="text-[10px] text-[#333]">© {new Date().getFullYear()} Rajeshwar Sehdev</p>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
